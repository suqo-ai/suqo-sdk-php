name: Tag release

# Cuts a release: runs the gate, moves the CHANGELOG's [Unreleased] entries under
# a dated version heading, marks the version Shipped in VERSIONING.md, commits,
# tags, and publishes.
#
# The bump is an explicit input rather than inferred from commit messages. That
# is deliberate: several breaking changes in this SDK are invisible to a
# Conventional Commits prefix -- widening a property type, reordering a named
# argument, changing an exception's base class -- and `fix(models): decode the
# shapes the API actually sends` was in fact breaking. See VERSIONING.md. Once
# the surface settles after 1.0, inference becomes safe and this can be replaced
# by release-please.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part to bump (ignored if version is given)'
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: 'Exact version, e.g. 0.2.0. Overrides bump.'
        required: false
        type: string
      dry_run:
        description: 'Run the gate and print the version without tagging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are how the next version is computed, so a shallow clone will
          # not do.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          # The floor the package claims to support.
          php-version: '8.1'
          extensions: curl, json, hash
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # The same gate CI runs on every PR. Re-run it here rather than trusting
      # that the branch tip already passed: this workflow can be dispatched
      # against any ref.
      - name: Validate manifest
        run: composer validate --strict

      - name: Invariants (§5.1)
        run: composer invariants

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer stan

      - name: Conformance suite (§13)
        run: composer test

      - name: Resolve the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(php tools/release.php next '${{ inputs.bump }}')"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH"; exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists. A published tag is never moved."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Prepare CHANGELOG and VERSIONING
        # Fails when [Unreleased] is empty, so a release with nothing in it
        # cannot be cut by accident.
        run: php tools/release.php prepare '${{ steps.version.outputs.version }}'

      - name: Show the prepared diff
        run: git --no-pager diff

      - name: Stop here on a dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run: would have tagged v${{ steps.version.outputs.version }}"
          exit 0

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add CHANGELOG.md VERSIONING.md
          git commit -m "chore(release): ${VERSION}"

          # Annotated, not lightweight: the tag carries the release message.
          git tag -a "v${VERSION}" -m "suqo/suqo-php v${VERSION}"

          git push origin HEAD
          git push origin "v${VERSION}"

      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          php tools/release.php notes "${VERSION}" > /tmp/notes.md
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/notes.md

      - name: Notify Packagist
        # Done here rather than left to release.yml: a tag pushed with the
        # built-in GITHUB_TOKEN does NOT trigger other workflows, so release.yml's
        # `on: push: tags` would never fire for a release cut from here.
        # release.yml remains the path for a tag pushed by hand from a laptop.
        if: ${{ !inputs.dry_run }}
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "${PACKAGIST_USERNAME}" ] || [ -z "${PACKAGIST_TOKEN}" ]; then
            echo "::warning::Packagist secrets not set; the tag is pushed but Packagist was not told."
            echo "::warning::Set PACKAGIST_USERNAME and PACKAGIST_TOKEN, or click Update on the package page."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/Code-Pros-AI/sdk-php"}}'
