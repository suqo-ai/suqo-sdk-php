name: Release

# Publishing a PHP package is not an upload: Packagist reads composer.json from
# the pushed tag and indexes it, and Composer then installs a GitHub archive of
# that tag. So this workflow does not build or push anything.
#
# Indexing is handled by the Packagist GitHub App, which is subscribed to this
# repository's push events. This workflow exists for the other half of the
# problem: a tag can be pushed to any commit, including one that never opened a
# PR and that CI never saw. It re-runs the full gate against the tagged commit
# so that a bad tag is loud rather than silently published.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # The floor the package claims to support, so the gate runs against
          # the oldest runtime a consumer may have.
          php-version: "8.1"
          extensions: curl, json, hash
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate manifest
        # --strict also fails if a `version` key is ever added to composer.json,
        # which would become a second source of truth alongside the tag.
        run: composer validate --strict

      - name: Invariants (§5.1)
        run: composer invariants

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer stan

      - name: Conformance suite (§13)
        run: composer test
