name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every version runs even when one fails: knowing it broke on the floor
      # *and* the ceiling is a different diagnosis from knowing it broke on one.
      fail-fast: false
      matrix:
        # This list must span composer.json's `"php": "^8.1"`, which resolves to
        # >=8.1 <9.0 -- so 8.5 is a version the package promises to support, not
        # an optional extra. The floor and the ceiling are the two rows that earn
        # their keep: 8.1 catches syntax or functions newer than the package
        # claims, 8.5 catches deprecations that have become errors. Widen
        # `require` and this list widens with it.
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, hash
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Invariants (§5.1)
        run: composer invariants

      - name: Lint
        run: composer lint

      - name: Static analysis
        run: composer stan

      - name: Conformance suite (§13)
        run: composer test
